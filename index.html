<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação de Apoio - TI & Som</title>
    <style>
        :root {
            --primary-blue: #2a75d3;
            --primary-red: #e63946;
            --bg-dark: #12161a;
            --card-bg: rgba(25, 32, 41, 0.65);
            --text-light: #f1f3f5;
            --text-muted: #adb5bd;
            --input-border: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(18, 22, 26, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-image: linear-gradient(rgba(12, 15, 19, 0.75), rgba(12, 15, 19, 0.75)), url('./fundo.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-light);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 4px solid var(--primary-red);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 20px;
        }

        h1 {
            color: var(--primary-blue);
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="date"],
        input[type="time"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            font-size: 15px;
            color: var(--text-light);
            transition: all 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-blue);
            background-color: rgba(18, 22, 26, 0.8);
            box-shadow: 0 0 0 3px rgba(42, 117, 211, 0.2);
        }

        input::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }

        .checkbox-group {
            background: rgba(12, 15, 19, 0.4);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--input-border);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: normal;
            margin-bottom: 10px;
            cursor: pointer;
            color: var(--text-light);
        }

        .checkbox-label:last-child {
            margin-bottom: 0;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary-blue);
        }

        button {
            width: 100%;
            background-color: var(--primary-blue);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #1a5bb5;
            border-bottom: 3px solid var(--primary-red);
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
            border-bottom: none;
        }

        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Solicitação de Apoio: Som e Informática</h1>
        <p class="subtitle">Preencha os dados abaixo para reservar equipamentos e suporte técnico para o seu evento.</p>
    </header>

    <!-- Forçamos o formulário a nunca disparar ações nativas de recarregamento -->
    <form id="solicitacaoForm" onsubmit="return false;">
        <div class="form-group">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" required placeholder="Digite seu nome">
        </div>

        <div class="form-group">
            <label for="setor">Setor/Departamento</label>
            <input type="text" id="setor" required placeholder="Ex: RH, Marketing">
        </div>

        <div class="form-group">
            <label for="evento">Nome do Evento</label>
            <input type="text" id="evento" required placeholder="Ex: Palestra de Integração">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="data">Data do Evento</label>
                <input type="date" id="data" required>
            </div>
            <div class="form-group">
                <label for="horario">Horário de Início</label>
                <input type="time" id="horario" required>
            </div>
        </div>

        <div class="form-group">
            <label for="local">Local do Evento</label>
            <select id="local" required>
                <option value="">Selecione o local...</option>
                <option value="Auditório Principal">Auditório Principal</option>
                <option value="Sala de Reuniões A">Sala de Reuniões A</option>
                <option value="Pátio / Bloco Central">Pátio / Bloco Central</option>
                <option value="Outro">Outro (Especificar nas observações)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Necessidades de Som</label>
            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="som" value="Microfones Sem Fio"> Microfones Sem Fio
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="som" value="Caixas de Som Adicionais"> Caixas de Som Adicionais
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="som" value="Mesa de Som Dedicada"> Mesa de Som Dedicada
                </label>
            </div>
        </div>

        <div class="form-group">
            <label>Necessidades de Informática</label>
            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="ti" value="Projetor / Datashow"> Projetor / Datashow
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="ti" value="Notebook para Apresentação"> Notebook para Apresentação
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="ti" value="Passador de Slides"> Passador de Slides (Laser)
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="ti" value="Ponto de Internet Cabeada"> Ponto de Internet Cabeada
                </label>
            </div>
        </div>

        <div class="form-group">
            <label for="tecnico">Necessita de Técnico no Local durante o evento?</label>
            <select id="tecnico" required>
                <option value="Não, apenas a montagem/testes iniciais">Não, apenas a montagem/testes iniciais</option>
                <option value="Sim, suporte durante todo o evento">Sim, suporte durante todo o evento</option>
            </select>
        </div>

        <div class="form-group">
            <label for="obs">Observações ou Detalhes Adicionais</label>
            <textarea id="obs" rows="4" placeholder="Descreva aqui outras necessidades específicas..."></textarea>
        </div>

        <!-- Botão do tipo button impede qualquer recarregamento acidental do navegador -->
        <button type="button" id="btnEnviar" onclick="dispararEnvio()">Enviar Solicitação</button>
    </form>
</div>

<script>
    const URL_PLANILHA = 'https://google.com';

    function dispararEnvio() {
        const btn = document.getElementById('btnEnviar');
        
        // Coleta e validação manual estrita dos elementos para evitar quebras de carregamento
        const nome = document.getElementById('nome').value.trim();
        const setor = document.getElementById('setor').value.trim();
        const evento = document.getElementById('evento').value.trim();
        const data = document.getElementById('data').value;
        const horario = document.getElementById('horario').value;
        const local = document.getElementById('local').value;

        // Se algum campo obrigatório estiver vazio, avisa o usuário e aborta sem mexer na página
        if (!nome || !setor || !evento || !data || !horario || !local) {
