<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação de Serviço - Pelotão de Obras</title>
    <style>
        :root {
            --primary-blue: #2a75d3;
            --primary-red: #e63946;
            --bg-dark: #12161a;
            --card-bg: rgba(25, 32, 41, 0.75);
            --text-light: #f1f3f5;
            --text-muted: #adb5bd;
            --input-border: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(18, 22, 26, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            overflow-y: auto;
            background-image: linear-gradient(rgba(12, 15, 19, 0.8), rgba(12, 15, 19, 0.8)), url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-light);
            line-height: 1.6;
            padding: 20px 20px 60px 20px;
        }

        .container {
            max-width: 700px;
            margin: 20px auto 40px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 4px solid var(--primary-red);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 20px;
        }

        h1 {
            color: var(--primary-blue);
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            text-transform: uppercase;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            font-size: 15px;
            color: var(--text-light);
            transition: all 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-blue);
            background-color: rgba(18, 22, 26, 0.8);
            box-shadow: 0 0 0 3px rgba(42, 117, 211, 0.2);
        }

        input::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }

        .checkbox-group {
            background: rgba(12, 15, 19, 0.4);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--input-border);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: normal;
            margin-bottom: 10px;
            cursor: pointer;
            color: var(--text-light);
        }

        .checkbox-label:last-child {
            margin-bottom: 0;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary-blue);
        }

        .btn-submit {
            display: block;
            width: 100%;
            background-color: var(--primary-blue);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            text-transform: uppercase;
            margin-top: 25px;
        }

        .btn-submit:hover {
            background-color: #1a5bb5;
            border-bottom: 3px solid var(--primary-red);
        }

        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Solicitação de Serviço: Pelotão de Obras</h1>
        <p class="subtitle">Preencha os dados abaixo para registrar seu pedido de manutenção, reparo ou benfeitoria.</p>
    </header>

    <form action="https://web3forms.com" method="POST">
        
        <!-- ⚠️ SUBSTITUA O VALOR ABAIXO PELA SUA CHAVE DO WEB3FORMS -->
        <input type="hidden" name="access_key" value="COLE_AQUI_A_SUA_CHAVE_DO_WEB3FORMS">
        <input type="hidden" name="subject" value="Nova DIOP / Solicitação de Serviço de Obras">
        <input type="hidden" name="from_name" value="Formulário Obras">
        
        <!-- Redirecionamento após o envio -->
        <input type="hidden" name="redirect" value="https://seusite.com">

        <div class="form-row">
            <div class="form-group">
                <label for="pgrad">Posto / Graduação</label>
                <select id="pgrad" name="Posto_Graduacao" required>
                    <option value="">Selecione...</option>
                    <option value="Oficial Superior">Oficial Superior</option>
                    <option value="Oficial Subalterno/Intermediário">Oficial Sub/Interm</option>
                    <option value="Subtenente/Sargento">Subtenente / Sargento</option>
                    <option value="Cabo/Soldado">Cabo / Soldado</option>
                    <option value="Civil">Civil / Servidor</option>
                </select>
            </div>
            <div class="form-group">
                <label for="nome">Nome de Guerra</label>
                <input type="text" id="nome" name="Nome de Guerra" required placeholder="Ex: Sgt Silva">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="setor">Seção / Subunidade Solicitante</label>
                <input type="text" id="setor" name="Seção Solicitante" required placeholder="Ex: 1ª Cia Fuz, S4, Pavilhão do Comando">
            </div>
            <div class="form-group">
                <label for="contato">Ramal Interno / Ritex / Celular</label>
                <input type="text" id="contato" name="Contato Solicitante" required placeholder="Ex: Ramal 2045 ou (61) 9xxxx-xxxx">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="local">Local Exato da Manutenção</label>
                <input type="text" id="local" name="Local Exato" required placeholder="Ex: Banheiro do Alojamento de Cabos">
            </div>
            <div class="form-group">
                <label for="prioridade">Prioridade Estimada</label>
                <select id="prioridade" name="Prioridade Urgência" required>
                    <option value="Baixa">Baixa (Rotina / Melhoria)</option>
                    <option value="Média">Média (Prejuízo parcial das funções)</option>
                    <option value="Alta">Alta (Vazamento grave, risco estrutural)</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Natureza do Serviço (Selecione todas que se aplicam)</label>
            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="Serviço: Hidráulica" value="Sim"> Hidráulica (Vazamentos, pias, vasos sanitários, tubulações)
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="Serviço: Elétrica" value="Sim"> Elétrica (Disjuntores, fiação, lâmpadas queimadas, tomadas)
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="Serviço: Alvenaria" value="Sim"> Alvenaria / Carpintaria (Reparo em paredes, portas, fechaduras)
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="Serviço: Pintura" value="Sim"> Pintura (Retoques, áreas internas ou externas)
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="Serviço: Refrigeração" value="Sim"> Refrigeração (Manutenção / limpeza de Ar-Condicionado)
                </label>
            </div>
        </div>

        <div class="form-group">
            <label for="descricao">Descrição Detalhada do Problema</label>
            <textarea id="descricao" name="Descrição do Problema" rows="5" required placeholder="Descreva detalhadamente o que precisa ser feito ou consertado (Ex: A torneira da pia esquerda está espanada e vazando sem parar)..."></textarea>
        </div>

        <button type="submit" class="btn-submit">Enviar Solicitação de Obras</button>
    </form>
</div>

</body>
</html>
