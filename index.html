<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação de Apoio - TI & Som</title>
    <style>
        :root {
            --primary-blue: #2a75d3;
            --primary-red: #e63946;
            --bg-dark: #12161a;
            --card-bg: #1e252b;
            --text-light: #f1f3f5;
            --text-muted: #adb5bd;
            --input-border: #343a40;
            --input-bg: #2b323a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Caminho relativo ideal para quando os arquivos estão na mesma raiz do GitHub */
            background-image: linear-gradient(rgba(18, 22, 26, 0.85), rgba(18, 22, 26, 0.85)), url('./fundo.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-light);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            border-top: 4px solid var(--primary-red);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--bg-dark);
            padding-bottom: 20px;
        }

        h1 {
            color: var(--primary-blue);
            font-size: 24px;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="date"],
        input[type="time"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 4px;
            font-size: 15px;
            color: var(--text-light);
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-blue);
        }

        input::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }

        .checkbox-group {
            background: var(--bg-dark);
            padding: 15px;
            border-radius: 4px;
            border: 1px solid var(--input-border);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: normal;
            margin-bottom: 10px;
            cursor: pointer;
            color: var(--text-light);
        }

        .checkbox-label:last-child {
            margin-bottom: 0;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary-blue);
        }

        button {
            width: 100%;
            background-color: var(--primary-blue);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #1a5bb5;
            border-bottom: 3px solid var(--primary-red);
        }

        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Solicitação de Apoio: Som e Informática</h1>
        <p class="subtitle">Preencha os dados abaixo para reservar equipamentos e suporte técnico para o seu evento.</p>
    </header>

    <form id="solicitacaoForm">
        <div class="form-group">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" required placeholder="Digite seu nome">
        </div>

        <div class="form-group">
            <label for="setor">Setor/Departamento</label>
            <input type="text" id="setor" required placeholder="Ex: RH, Marketing">
        </div>

        <div class="form-group">
            <label for="evento">Nome do Evento</label>
            <input type="text" id="evento" required placeholder="Ex: Palestra de Integração">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="data">Data do Evento</label>
                <input type="date" id="data" required>
            </div>
            <div class="form-group">
                <label for="horario">Horário de Início</label>
                <input type="time" id="horario" required>
            </div>
        </div>

        <div class="form-group">
            <label for="local">Local do Evento</label>
            <select id="local" required>
                <option value="">Selecione o local...</option>
                <option value="auditorio_principal">Auditório Principal</option>
                <option value="sala_reunioes_a">Sala de Reuniões A</option>
                <option value="bloco_central">Pátio / Bloco Central</option>
                <option value="outro">Outro (Especificar nas observações)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Necessidades de Som</label>
            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="som" value="microfone_sem_fio"> Microfones Sem Fio
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="som" value="caixas_som"> Caixas de Som Adicionais
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="som" value="mesa_som"> Mesa de Som Dedicada
                </label>
            </div>
        </div>

        <div class="form-group">
            <label>Necessidades de Informática</label>
            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="ti" value="projetor"> Projetor / Datashow
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="ti" value="notebook"> Notebook para Apresentação
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="ti" value="passador_slides"> Passador de Slides (Laser)
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="ti" value="internet_cabo"> Ponto de Internet Cabeada
                </label>
            </div>
        </div>

        <div class="form-group">
            <label for="tecnico">Necessita de Técnico no Local durante o evento?</label>
            <select id="tecnico" required>
                <option value="nao">Não, apenas a montagem/testes iniciais</option>
                <option value="sim">Sim, suporte durante todo o evento</option>
            </select>
        </div>

        <div class="form-group">
            <label for="obs">Observações ou Detalhes Adicionais</label>
            <textarea id="obs" rows="4" placeholder="Descreva aqui outras necessidades específicas..."></textarea>
        </div>

        <button type="submit">Enviar Solicitação</button>
    </form>
</div>

<script>
    document.getElementById('solicitacaoForm').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Solicitação enviada com sucesso! A equipe de TI/Som entrará em contato para confirmar a disponibilidade.');
        this.reset();
    });
</script>

</body>
</html>
