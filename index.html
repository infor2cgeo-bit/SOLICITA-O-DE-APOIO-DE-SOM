<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação de Apoio - TI & Som</title>
    <style>
        :root {
            --primary-blue: #2a75d3;
            --primary-red: #e63946;
            --bg-dark: #12161a;
            --card-bg: rgba(25, 32, 41, 0.65);
            --text-light: #f1f3f5;
            --text-muted: #adb5bd;
            --input-border: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(18, 22, 26, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-image: linear-gradient(rgba(12, 15, 19, 0.75), rgba(12, 15, 19, 0.75)), url('./fundo.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-light);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 4px solid var(--primary-red);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 20px;
        }

        h1 {
            color: var(--primary-blue);
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            text-transform: uppercase;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="date"],
        input[type="time"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            font-size: 15px;
            color: var(--text-light);
            transition: all 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-blue);
            background-color: rgba(18, 22, 26, 0.8);
            box-shadow: 0 0 0 3px rgba(42, 117, 211, 0.2);
        }

        input::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }

        .checkbox-group {
            background: rgba(12, 15, 19, 0.4);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--input-border);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: normal;
            margin-bottom: 10px;
            cursor: pointer;
            color: var(--text-light);
        }

        .checkbox-label:last-child {
            margin-bottom: 0;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary-blue);
        }

        input[type="submit"] {
            width: 100%;
            background-color: var(--primary-blue);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            text-transform: uppercase;
        }

        input[type="submit"]:hover {
            background-color: #1a5bb5;
            border-bottom: 3px solid var(--primary-red);
        }

        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Solicitação de Apoio: Som e Informática</h1>
        <p class="subtitle">Preencha os dados abaixo para registrar seu pedido de equipamentos e suporte para o evento.</p>
    </header>

    <!-- Envio direto pelo navegador sem depender de códigos Javascript secundários -->
    <form action="https://hook.us2.make.com/uhdaeeb7kb9q5hmtf1t5x3rwntxonij9">
        
        <!-- ⚠️ COLE A SUA CHAVE DO WEB3FORMS ABAIXO NO VALOR DO VALUE -->
        <input type="hidden" name="access_key" value="COLE_AQUI_A_SUA_CHAVE_DO_WEB3FORMS">
        <input type="hidden" name="subject" value="Nova Solicitação de Apoio de TI/Som">
        <input type="hidden" name="from_name" value="Formulário do Site">

        <div class="form-group">
            <label for="nome">Nome de Guerra</label>
            <input type="text" id="nome" name="Nome de Guerra" required placeholder="Digite seu nome de guerra">
        </div>

        <div class="form-group">
            <label for="setor">Seção</label>
            <input type="text" id="setor" name="Seção" required placeholder="Ex: S1, S3, Almoxarifado">
        </div>

        <div class="form-group">
            <label for="evento">Nome do Evento</label>
            <input type="text" id="evento" name="Nome do Evento" required placeholder="Ex: Palestra de Integração">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="data">Data do Evento</label>
                <input type="date" id="data" name="Data do Evento" required>
            </div>
            <div class="form-group">
                <label for="horario">Horário de Início</label>
                <input type="time" id="horario" name="Horário de Início" required>
            </div>
        </div>

        <div class="form-group">
            <label for="local">Local do Evento</label>
            <select id="local" name="Local do Evento" required>
                <option value="">Selecione o local...</option>
                <option value="Auditório">Auditório</option>
                <option value="Sala de Reunião">Sala de Reunião</option>
                <option value="Pátio de Formatura">Pátio de Formatura</option>
                <option value="Outro">Outro (Especificar nas observações)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Necessidades de Som</label>
            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="Som: Microfone" value="Sim"> Microfones Sem Fio
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="Som: Caixas" value="Sim"> Caixas de Som
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="Som: Mesa" value="Sim"> Mesa de Som Dedicada
                </label>
            </div>
        </div>

        <div class="form-group">
            <label>Necessidades de Informática</label>
            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="TI: Projetor" value="Sim"> Projetor
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="TI: Notebook" value="Sim"> Notebook para Apresentação
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="TI: Passador" value="Sim"> Passador de Slides (Laser)
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="TI: Internet" value="Sim"> Ponto de Internet Cabeada
                </label>
            </div>
        </div>

        <div class="form-group">
            <label for="tecnico">Necessita de Técnico no Local durante o evento?</label>
            <select id="tecnico" name="Necessita de Técnico" required>
                <option value="Não, apenas a montagem/testes iniciais">Não, apenas a montagem/testes iniciais</option>
                <option value="Sim, suporte durante todo o evento">Sim, suporte durante todo o evento</option>
            </select>
        </div>

        <div class="form-group">
            <label for="obs">Observações ou Detalhes Adicionais</label>
            <textarea id="obs" name="Observações Adicionais" rows="4" placeholder="Descreva aqui outras necessidades específicas..."></textarea>
        </div>

        <!-- Botão nativo puro do sistema operacional -->
        <input type="submit" value="Enviar Solicitação">
    </form>
</div>

</body>
</html>
